analysis_id: "gse61256_quadron_100bp"
outdir: "results/g4_methylation_age_quadron_100bp"

# Default public experiment: three human tissues from GSE61256.
samplesheet: null
geo_series: "GSE61257:adipose,GSE61258:liver,GSE61259:muscle"

# Quadron hg38 annotations. These cluster paths are established in the
# existing Entropy pipeline; they do not include the BTEP directory.
g4_stable: "/data/RBL_NCI/ccrrbl20/Quadron.stable.bed"
g4_unstable: "/data/RBL_NCI/ccrrbl20/Quadron.unstable.bed"
g4_flank_bp: 100
g4_long_quantile: 0.99
g4_long_mad_multiplier: 3
g4_long_min_bp: 0

ucsc_goldenpath_dir: "/fdb/genomebrowser/goldenPath/hg38"
rloop_bed: ""
rloop_url: "https://rlbase-data.s3.amazonaws.com/misc/rlregions_dRNH.narrowPeak"
replication_timing_bed: ""
replication_timing_url: ""
cross_reactive_probes: ""
cross_reactive_probes_url: ""
# Primary contrast does not condition on motif density, long-cluster status, or
# strand-specific motif counts, because they derive from the Quadron annotation.
include_g4_architecture: false
probe_manifest: "../results/submission_v3/reference_manifest/probe_gene_manifest.csv.gz"

min_samples: 2
default_covariates: "sex|bmi"
slurm_partition: "norm"